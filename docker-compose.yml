services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/statuses > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8080"
    volumes:
      # Live-reload your edits, but keep the image's node_modules.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
